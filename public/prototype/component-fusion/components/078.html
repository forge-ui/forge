<div class="ux u078">

  <div class="u078-log" aria-live="polite"></div>

</div><script>(function () {
  var root = document.currentScript.previousElementSibling;
  var log = root.querySelector('.u078-log'), reply = root.querySelector('.u078-reply'), rb = reply.querySelector('b'), rt = reply.querySelector('em'), rx = root.querySelector('.u078-rx');
  var form = root.querySelector('.u078-bar'), input = root.querySelector('.u078-in'), send = root.querySelector('.u078-send');

  var target = null, ts = [];
  var ARROW = '<svg viewBox="0 0 14 14"><path d="M5.5 3.5L2 7l3.5 3.5M2 7h6.5a3.5 3.5 0 0 1 3.5 3.5"/></svg>';
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function bubble(text, me, quote, who) {
    var m = document.createElement('div');
    m.className = 'u078-m in' + (me ? ' me' : '');
    m.innerHTML = '<span class="u078-rep" aria-hidden="true">' + ARROW + '</span><span class="u078-bub">' + (quote ? '<span class="u078-q">' + esc(quote) + '</span>' : '') + esc(text) + '</span>' + (me ? '' : '<button class="u078-rb" type="button" aria-label="Reply to this message">' + ARROW + '</button>');

    if (!me) wire(m);
    while (log.children.length > 7) log.firstChild.remove();
    return m;
  }
  function setReply(m) {
    target = m;
    rb.textContent = 'Replying to ' + m.getAttribute('data-w');
    rt.textContent = m.getAttribute('data-t');
    reply.classList.add('on'); rx.tabIndex = 0;
    input.focus({ preventScroll: true });
  }
  function clearReply() { target = null; reply.classList.remove('on'); rx.tabIndex = -1; }
  // 오른쪽으로 끌면 답장 화살표가 차오르고, 60px을 넘기면 놓을 때 답장 대상이 됩니다
  function wire(m) {
    var bub = m.querySelector('.u078-bub'), rep = m.querySelector('.u078-rep'), sx = 0, dx = 0, down = false;
    bub.addEventListener('pointerdown', function (e) { if (e.button !== 0) return; down = true; sx = e.clientX; dx = 0; bub.setPointerCapture(e.pointerId); m.classList.add('drag'); });

      bub.style.setProperty('--dx', d + 'px'); m.style.setProperty('--ro', Math.min(1, dx / 60).toFixed(2));

    var end = function () { if (!down) return; down = false; m.classList.remove('drag'); bub.style.setProperty('--dx', '0px'); m.style.setProperty('--ro', 0); rep.classList.remove('full'); if (dx >= 60) setReply(m); };

  input.addEventListener('keydown', function (e) {

    else if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true })); }
  });
  // 보내면 입력창에서 말풍선이 솟아오르고, 잠시 입력 중 점이 보인 뒤 답장이 옵니다

})();</script></body></html>
