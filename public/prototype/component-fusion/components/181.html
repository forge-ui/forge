const opts=new URLSearchParams(location.search);document.documentElement.dataset.theme=opts.get('theme')||'light';document.documentElement.dataset.motion=opts.get('motion')||'auto';document.documentElement.dataset.accent=opts.get('accent')||'purple';document.documentElement.dataset.locale=opts.get('lang')||'zh';

const originalMatch=window.matchMedia.bind(window);window.forgeReduced=()=>document.documentElement.dataset.motion==='none'||originalMatch('(prefers-reduced-motion: reduce)').matches;window.matchMedia=q=>q.includes('prefers-reduced-motion')?new Proxy(originalMatch(q),{get:(target,key)=>key==='matches'?window.forgeReduced():typeof target[key]==='function'?target[key].bind(target):target[key]}):originalMatch(q);

<div class="ux u181" data-state="initial"><div class="task-name">Homepage accessibility check</div><div class="team"><button class="bin" data-i="0" style="--tone:var(--fg-green-500)" aria-label="Assign to Seoyeon"><div class="vessel"><i></i><output></output></div><b>Seoyeon</b></button><button class="bin" data-i="1" style="--tone:var(--accent)" aria-label="Assign to Minho"><div class="vessel"><i></i><output></output></div><b>Minho</b></button><button class="bin" data-i="2" style="--tone:var(--fg-yellow-700)" aria-label="Assign to Jisoo"><div class="vessel"><i></i><output></output></div><b>Jisoo</b></button></div></div><script>(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!window.forgeReduced())el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};let loads=[2,1,3],task=0;const jobs=['Homepage accessibility check','Tidy the brand guide','Review the mobile menu','Clean up the icon set'];function render(){qa('.bin').forEach((b,i)=>{b.querySelector('i').style.setProperty('--fill',loads[i]/5*100+'%');b.querySelector('output').textContent=loads[i]+' / 5';b.disabled=loads[i]>=5});q('.task-name').textContent=jobs[task%4];state('loads-'+loads.join('-'))}qa('.bin').forEach(b=>b.onclick=()=>{loads[+b.dataset.i]++;task++;render();pulse(q('.task-name'),[{transform:'translateY(-6px)',opacity:.3},{transform:'none',opacity:1}])});render();})();</script></body></html>
