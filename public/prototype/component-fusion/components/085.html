.u085{--pull:0;position:relative;width:330px;height:500px;display:flex;flex-direction:column;border-radius:16px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 30px 60px -36px var(--ux-shadow-strong);overflow:hidden}

<div class="ux u085">
  <div class="u085-top"><b>Team updates</b><button class="u085-rb" type="button" aria-label="Refresh"><svg viewBox="0 0 17 17" aria-hidden="true"><path d="M14 8.5a5.5 5.5 0 1 1-1.6-3.9M14 2.5v3h-3"/></svg></button></div>
  <div class="u085-vp" tabindex="0" aria-label="Team updates list. Press R to refresh">
    <span class="u085-ind" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" pathLength="100"/><path d="M12 1.6l3.4 2.6L12 6.8z"/></svg></span>
    <span class="u085-msg" aria-hidden="true">Pull down to refresh</span>
    <ul class="u085-list" aria-live="polite"></ul>
  </div>
</div><script>(function () {
  var root = document.currentScript.previousElementSibling;
  var vp = root.querySelector('.u085-vp'), list = root.querySelector('.u085-list'), msg = root.querySelector('.u085-msg'), rb = root.querySelector('.u085-rb');

  var POOL = [
    ['Harin Yoon', 'Posted draft v3', 'linear-gradient(140deg,#22C3A6,#0EA5E9)'],
    ['Doyun Han', 'Shared motion tests', 'linear-gradient(140deg,#8B6CFF,#5B8CFF)'],
    ['Mina Jung', 'Updated the QA list', 'linear-gradient(140deg,#FF7A93,#B04FD0)'],
    ['Lumen Bot', '3 deploys passed', 'linear-gradient(140deg,#FFB547,#FF7A45)'],
    ['Jiho Park', 'Booked the meetup', 'linear-gradient(140deg,#3D8BFF,#22C3A6)'],
    ['Seoyeon Kim', 'Design system 2.4', 'linear-gradient(140deg,#B04FD0,#FF6B8B)'],
    ['Woojin Choi', 'Added 48 icons', 'linear-gradient(140deg,#0EA5E9,#7B61FF)']
  ];
  var next = 0, mins = 0, busy = false;
  function item(d, ago, fresh, i) {
    var li = document.createElement('li');
    li.className = 'u085-it' + (fresh ? ' fresh' : '');
    li.style.setProperty('--i', i || 0);
    li.innerHTML = '<i style="--g:' + d[2] + '" aria-hidden="true"></i><div><b></b><span></span></div>';
    li.querySelector('b').textContent = d[0] + ' · ' + d[1];
    li.querySelector('span').textContent = ago;
    return li;
  }
  for (var k = 0; k < 5; k++) list.appendChild(item(POOL[next++], (k + 1) * 12 + ' min ago'));
  function set(p) { root.style.setProperty('--pull', p.toFixed(1)); root.classList.toggle('is-ready', p >= 70); msg.textContent = p >= 70 ? 'Release to refresh' : 'Pull down to refresh'; }
  // 새 글은 맨 위로 밀려 들어오고, 잠깐 강조된 뒤 원래 색으로 돌아옵니다
  function refresh() {
    if (busy) return;
    busy = true;
    root.classList.add('rel', 'is-load');
    set(70);
    msg.textContent = 'Loading new updates';
    setTimeout(function () {
      if (!root.isConnected) return;
      var add = 1 + (mins % 2);
      for (var i = add - 1; i >= 0; i--) { list.insertBefore(item(POOL[next % POOL.length], 'Just now', true, i), list.firstChild); next++; }
      while (list.children.length > 6) list.lastChild.remove();
      mins++;
      root.classList.remove('is-load');
      set(0);
      setTimeout(function () { list.querySelectorAll('.fresh').forEach(function (x) { x.classList.remove('fresh'); }); busy = false; }, 1600);
    }, window.forgeReduced() ? 300 : 1300);
  }
  // 당긴 거리에 저항을 줘서 갈수록 무겁게 따라오게 합니다
  var sy = 0, down = false, pull = 0;
  vp.addEventListener('pointerdown', function (e) { if (busy || e.button !== 0) return; down = true; sy = e.clientY; pull = 0; vp.setPointerCapture(e.pointerId); vp.classList.add('drag'); root.classList.remove('rel'); });
  vp.addEventListener('pointermove', function (e) {
    if (!down) return;
    var k = vp.offsetHeight / vp.getBoundingClientRect().height, d = Math.max(0, (e.clientY - sy) * k);
    pull = 120 * (1 - Math.exp(-d / 140));
    set(pull);
  });
  function end() { if (!down) return; down = false; vp.classList.remove('drag'); if (pull >= 70) refresh(); else { root.classList.add('rel'); set(0); } }
  vp.addEventListener('pointerup', end); vp.addEventListener('pointercancel', end);
  vp.addEventListener('keydown', function (e) { if (e.key === 'r' || e.key === 'R') { e.preventDefault(); refresh(); } });
  rb.addEventListener('click', refresh);
  set(0);
})();</script></body></html>
