<div class="ux u075">

</div><script>(function () {
  var root = document.currentScript.previousElementSibling;
  var add = root.querySelector('.u075-add'), pan = root.querySelector('.u075-pan'), hd = root.querySelector('.u075-hd'), ul = root.querySelector('.u075-body ul');
  var hb = hd.querySelector('b'), hs = hd.querySelector('small');

  var F = [['Brand guide.pdf', 12.4, 'PDF', 'linear-gradient(140deg,#FF6B8B,#E5484D)', 1.6], ['Main video.mp4', 48, 'MP4', 'linear-gradient(140deg,#7B61FF,#3D8BFF)', 0.9], ['Icon set.zip', 3.2, 'ZIP', 'linear-gradient(140deg,#FFB547,#FF7A45)', 2.4]];
  var files = [], raf = 0, last = 0, failed = false;
  function build() {
    ul.innerHTML = '';
    files = F.map(function (f) {
      var li = document.createElement('li');
      li.className = 'u075-f';
      li.innerHTML = '<span class="u075-ic" style="--c:' + f[3] + '" aria-hidden="true">' + f[2] + '</span><span class="u075-fx"><b><span></span><small></small></b><span class="u075-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></span></span><span class="u075-st"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9.4l3.2 3.2L14 5.6"/></svg></span>';

    });
  }
  function paint() {
    var tot = 0, done = 0, remain = 0, active = 0;
    files.forEach(function (f) {
      tot += f.size; done += f.size * f.p;
      f.li.querySelector('.u075-bar').style.setProperty('--p', f.p.toFixed(3));
      f.li.querySelector('.u075-bar').setAttribute('aria-valuenow', Math.round(f.p * 100));
      f.li.querySelector('small').textContent = f.state === 'bad' ? 'Failed · ' + Math.round(f.p * 100) + '%' : f.state === 'ok' ? f.size + 'MB' : Math.round(f.p * 100) + '%';
      if (f.state === 'up') { active++; remain = Math.max(remain, (1 - f.p) / (f.speed * 0.18)); }
    });
    var all = done / tot, ok = files.filter(function (f) { return f.state === 'ok'; }).length, bad = files.filter(function (f) { return f.state === 'bad'; }).length;
    hd.querySelector('.u075-ring').style.setProperty('--p', all.toFixed(3));
    root.classList.toggle('is-done', ok === files.length);
    if (ok === files.length) { hb.textContent = 'Uploaded ' + ok + ' files'; hs.textContent = 'Total ' + tot.toFixed(1) + 'MB'; }
    else if (active) { hb.textContent = 'Uploading ' + active + (active === 1 ? ' file' : ' files'); hs.textContent = Math.round(all * 100) + '% · about ' + Math.max(1, Math.ceil(remain)) + 's left'; }
    else if (bad) { hb.textContent = bad + (bad === 1 ? ' file failed' : ' files failed'); hs.textContent = 'Press retry to resume'; }
  }
  // 파일마다 속도를 달리해 막대를 채우고, 영상 파일은 처음에 64%에서 한 번 실패시킵니다
  function loop(now) {
    if (!root.isConnected) return;
    var dt = Math.min(64, now - last) / 1000; last = now;
    var running = false;
    files.forEach(function (f) {
      if (f.state !== 'up') return;
      running = true;
      f.p = Math.min(1, f.p + dt * f.speed * 0.18 * (window.forgeReduced() ? 4 : 1));
      if (!failed && f.size === 48 && f.p >= 0.64) { failed = true; f.state = 'bad'; f.li.classList.add('bad'); retryBtn(f); }
      else if (f.p >= 1) { f.state = 'ok'; f.li.classList.add('ok'); }
    });

  }

    st.innerHTML = ''; st.appendChild(b);
    b.addEventListener('click', function () {
