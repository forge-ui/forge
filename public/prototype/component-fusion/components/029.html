const opts=new URLSearchParams(location.search);document.documentElement.dataset.theme=opts.get('theme')||'light';document.documentElement.dataset.motion=opts.get('motion')||'auto';document.documentElement.dataset.accent=opts.get('accent')||'purple';document.documentElement.dataset.locale=opts.get('lang')||'zh';

const originalMatch=window.matchMedia.bind(window);window.forgeReduced=()=>document.documentElement.dataset.motion==='none'||originalMatch('(prefers-reduced-motion: reduce)').matches;window.matchMedia=q=>q.includes('prefers-reduced-motion')?new Proxy(originalMatch(q),{get:(target,key)=>key==='matches'?window.forgeReduced():typeof target[key]==='function'?target[key].bind(target):target[key]}):originalMatch(q);
try{Object.defineProperty(navigator,'clipboard',{value:{writeText:async(text)=>{window.demoClipboard=text},readText:async()=>window.demoClipboard||''}})}catch{}
window.addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data;if(d?.type==='forge-settings'){document.documentElement.dataset.theme=d.theme;if(d.lang){document.documentElement.dataset.locale=d.lang;window.forgeSetLocale?.(d.lang);}document.documentElement.dataset.accent=d.accent||'purple';document.documentElement.dataset.motion=d.motion;}});

window.addEventListener('DOMContentLoaded',()=>{window.forgeSetLocale?.(document.documentElement.dataset.locale||'zh');const root=document.querySelector('.ux');const emit=()=>parent.postMessage({type:'forge-state',id:"029",state:root?Object.fromEntries(Object.entries(root.dataset)): {},text:(root?.innerText||'').slice(0,6000)},'*');new MutationObserver(emit).observe(root||document.body,{subtree:true,childList:true,attributes:true,characterData:true});emit();setTimeout(()=>parent.postMessage({type:'forge-typography',id:"029",rows:window.forgeAuditTypography?.()||[],icons:[...document.querySelectorAll('.ux svg')].map(e=>({solar:e.classList.contains('solar'),viewBox:e.getAttribute('viewBox'),class:e.getAttribute('class'),geometry:e.innerHTML.slice(0,400)}))},'*'),30);parent.postMessage({type:'forge-ready',id:"029"},'*');});
</script><script src="/prototype/component-fusion/i18n.js"></script><script src="/prototype/component-fusion/typography-runtime.js"></script><link rel="stylesheet" href="/prototype/component-fusion/embed.css"><script src="/prototype/component-fusion/embed-runtime.js"></script></head><body><style>
.u029{position:relative;width:350px}
.u029-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.u029-head b{font-size:var(--forge-text-base-size);font-weight:var(--forge-font-bold-weight);letter-spacing:-.02em}
.u029-n{font-size:var(--forge-text-xs-size);font-weight:var(--forge-font-bold-weight);color:var(--ux-ink-3);font-variant-numeric:tabular-nums;transition:color .3s}
.u029-n.full{color:var(--ux-warn)}
.u029-field{display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px;height:142px;padding:12px;border-radius:16px;background:var(--ux-surface);box-shadow:0 0 0 1.5px var(--ux-line-2);cursor:text;transition:box-shadow .3s var(--ux-ease)}
.u029-field:focus-within{box-shadow:0 0 0 2px var(--ux-accent),0 0 0 6px var(--ux-accent-soft)}
.u029-field.shake{animation:u029-shake .42s var(--ux-ease)}
@keyframes u029-shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}}
.u029-tag{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 6px 0 12px;border-radius:11px;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--ux-ink));font-size:var(--forge-text-sm-size);font-weight:var(--forge-font-bold-weight);
  animation:u029-pop .45s var(--ux-spring);transition:transform .3s var(--ux-ease),opacity .3s var(--ux-ease),box-shadow .2s}
@keyframes u029-pop{from{transform:scale(.4);opacity:0}}
.u029-tag.out{transform:scale(.4);opacity:0}
.u029-tag.armed{box-shadow:0 0 0 2px var(--c);animation:u029-arm .3s var(--ux-ease)}
@keyframes u029-arm{50%{transform:scale(1.08)}}
.u029-x{width:22px;height:22px;border:0;padding:0;border-radius:7px;background:none;color:inherit;display:grid;place-items:center;opacity:.7}
.u029-x:hover{opacity:1;background:color-mix(in srgb,currentColor 15%,transparent)}
.u029-x:focus-visible{outline:2px solid currentColor;outline-offset:1px}
.u029-x svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.u029-in{flex:1;min-width:90px;height:34px;border:0;outline:0;background:none;font-size:var(--forge-text-sm-size);color:var(--ux-ink)}
.u029-in::placeholder{color:var(--ux-ink-3)}
.u029-msg{height:18px;margin:8px 4px 10px;font-size:var(--forge-text-xs-size);color:var(--ux-ink-3);transition:color .3s}
.u029-msg.warn{color:var(--ux-danger)}
.u029-sg-row{display:flex;flex-wrap:wrap;gap:6px}
.u029-sg{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px 0 9px;border:0;border-radius:999px;background:none;box-shadow:inset 0 0 0 1px var(--ux-line-2);font-size:var(--forge-text-xs-size);font-weight:var(--forge-font-semibold-weight);color:var(--ux-ink-2);transition:transform .35s var(--ux-spring),opacity .3s,box-shadow .2s}
.u029-sg:hover{box-shadow:inset 0 0 0 1px var(--ux-ink-3);color:var(--ux-ink)}
.u029-sg:active{transform:scale(.92)}
.u029-sg:focus-visible{outline:2px solid var(--ux-accent);outline-offset:2px}
.u029-sg svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.u029-sg.used{opacity:.3;pointer-events:none}
.u029-in:focus-visible{outline:none}
</style>
<div class="ux u029">
  <div class="u029-head"><b>Project tags</b><span class="u029-n">3 / 6</span></div>
  <div class="u029-field">
    <input class="u029-in" type="text" placeholder="Type a tag, press Enter" aria-label="Add tag" autocomplete="off">
  </div>
  <p class="u029-msg" aria-live="polite"></p>
  <div class="u029-sg-row" role="group" aria-label="Suggested tags"></div>
</div><script>(function () {
  var root = document.currentScript.previousElementSibling;
  var field = root.querySelector('.u029-field');
  var input = root.querySelector('.u029-in');
  var count = root.querySelector('.u029-n');
  var msg = root.querySelector('.u029-msg');
  var sgRow = root.querySelector('.u029-sg-row');
  var MAX = 6, t = 0;
  var PALETTE = [window.forgePaint("var(--accent)"), window.forgePaint("var(--fg-red)"), window.forgePaint("var(--fg-green-500)"), window.forgePaint("var(--fg-yellow-700)"), window.forgePaint("var(--accent)"), window.forgePaint("var(--accent)")];
  function colorOf(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return PALETTE[h % PALETTE.length]; }
  function tags() { return Array.prototype.slice.call(field.querySelectorAll('.u029-tag:not(.out)')); }
  function say(text, warn) {
    msg.textContent = text;
    msg.classList.toggle('warn', !!warn);
    clearTimeout(t);
    t = setTimeout(function () { if (root.isConnected) { msg.textContent = ''; msg.classList.remove('warn'); } }, 1800);
  }
  function refresh() {
    var n = tags().length;
    count.textContent = n + ' / ' + MAX;
    count.classList.toggle('full', n >= MAX);
    var have = tags().map(function (x) { return x.dataset.v; });
    Array.prototype.forEach.call(sgRow.children, function (b) { b.classList.toggle('used', have.indexOf(b.dataset.v) >= 0); });
  }
  function make(v) {
    var tag = document.createElement('span');
    tag.className = 'u029-tag';
    tag.dataset.v = v;
    tag.style.setProperty('--c', colorOf(v));
    var s = document.createElement('span');
    s.textContent = '#' + v;
    var x = document.createElement('button');
    x.type = 'button';
    x.className = 'u029-x';
    x.setAttribute('aria-label', 'Remove tag ' + v);
    x.innerHTML = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8"/></svg>';
    x.addEventListener('click', function () { remove(tag); input.focus(); });
    tag.appendChild(s); tag.appendChild(x);
    return tag;
  }
  function add(raw) {
    var v = raw.trim().replace(/^#/, '');
    if (!v) return false;
    if (tags().length >= MAX) {
      say('You can add up to six tags', true);
      field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
      return false;
    }
    if (tags().some(function (x) { return x.dataset.v === v; })) { say('That tag already exists', true); return false; }
    disarm();
    field.insertBefore(make(v), input);
    refresh();
    say('Added #' + v);
    return true;
  }
  function remove(tag) {
    if (tag.classList.contains('out')) return;
    tag.classList.add('out');
    say('Removed #' + tag.dataset.v);
    setTimeout(function () { if (root.isConnected) { tag.remove(); refresh(); } }, 280);
  }
  function disarm() { tags().forEach(function (x) { x.classList.remove('armed'); }); }
  input.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return; // 한글 조합 중에는 Enter를 기다립니다
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); if (add(input.value)) input.value = ''; }
    else if (e.key === 'Backspace' && !input.value) {
      var all = tags(), last = all[all.length - 1];
      if (!last) return;
      // 첫 번째 Backspace는 지울 태그를 강조하고, 두 번째에 지웁니다
      if (last.classList.contains('armed')) remove(last); else { disarm(); last.classList.add('armed'); }
    } else disarm();
  });
  input.addEventListener('blur', disarm);
  field.addEventListener('click', function (e) { if (e.target === field) input.focus(); });
  ['designsystem', 'motion', 'darkmode'].forEach(function (v) { field.insertBefore(make(v), input); });
  ['a11y', 'onboarding', 'microinteraction', 'dashboard'].forEach(function (v) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'u029-sg';
    b.dataset.v = v;
    b.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M2 6h8"/></svg>';
    b.appendChild(document.createTextNode(v));
    b.setAttribute('aria-label', 'Add tag ' + v);
    b.addEventListener('click', function () { add(v); });
    sgRow.appendChild(b);
  });
  refresh();
})();</script></body></html>
