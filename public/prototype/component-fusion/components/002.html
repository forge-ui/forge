<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' 'self'; script-src 'unsafe-inline' 'self'; img-src data: https:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>磁吸箭头按钮</title><link rel="stylesheet" href="/prototype/component-fusion/fonts.css"><link rel="stylesheet" href="/prototype/component-fusion/forge-tokens.css"><link rel="stylesheet" href="/prototype/component-fusion/shared/0a313cd69070.css"><style>.forge-workflow-icon{width:20px;height:20px;flex:none;vertical-align:middle}</style><script src="/prototype/component-fusion/shared/eebf74a88e48.js"></script><script src="/prototype/component-fusion/shared/c88975f10a60.js"></script><script>
const opts=new URLSearchParams(location.search);document.documentElement.dataset.theme=opts.get('theme')||'light';document.documentElement.dataset.motion=opts.get('motion')||'auto';document.documentElement.dataset.accent=opts.get('accent')||'purple';document.documentElement.dataset.locale=opts.get('lang')||'zh';
window.forgePaint=value=>{const node=document.createElement('span');node.style.color=value;document.documentElement.append(node);const result=getComputedStyle(node).color;node.remove();return result;};
const originalMatch=window.matchMedia.bind(window);window.forgeReduced=()=>document.documentElement.dataset.motion==='none'||originalMatch('(prefers-reduced-motion: reduce)').matches;window.matchMedia=q=>q.includes('prefers-reduced-motion')?new Proxy(originalMatch(q),{get:(target,key)=>key==='matches'?window.forgeReduced():typeof target[key]==='function'?target[key].bind(target):target[key]}):originalMatch(q);
try{Object.defineProperty(navigator,'clipboard',{value:{writeText:async(text)=>{window.demoClipboard=text},readText:async()=>window.demoClipboard||''}})}catch{}
window.addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data;if(d?.type==='forge-settings'){document.documentElement.dataset.theme=d.theme;if(d.lang){document.documentElement.dataset.locale=d.lang;window.forgeSetLocale?.(d.lang);}document.documentElement.dataset.accent=d.accent||'purple';document.documentElement.dataset.motion=d.motion;}});
window.addEventListener('error',e=>parent.postMessage({type:'forge-error',id:"002",error:e.message},'*'));
window.addEventListener('unhandledrejection',e=>parent.postMessage({type:'forge-error',id:"002",error:String(e.reason)},'*'));
window.addEventListener('DOMContentLoaded',()=>{window.forgeSetLocale?.(document.documentElement.dataset.locale||'zh');const root=document.querySelector('.ux');const emit=()=>parent.postMessage({type:'forge-state',id:"002",state:root?Object.fromEntries(Object.entries(root.dataset)): {},text:(root?.innerText||'').slice(0,6000)},'*');new MutationObserver(emit).observe(root||document.body,{subtree:true,childList:true,attributes:true,characterData:true});emit();setTimeout(()=>parent.postMessage({type:'forge-typography',id:"002",rows:window.forgeAuditTypography?.()||[],icons:[...document.querySelectorAll('.ux svg')].map(e=>({solar:e.classList.contains('solar'),viewBox:e.getAttribute('viewBox'),class:e.getAttribute('class'),geometry:e.innerHTML.slice(0,400)}))},'*'),30);parent.postMessage({type:'forge-ready',id:"002"},'*');});
</script><script src="/prototype/component-fusion/i18n.js"></script><script src="/prototype/component-fusion/typography-runtime.js"></script><link rel="stylesheet" href="/prototype/component-fusion/embed.css"><script src="/prototype/component-fusion/embed-runtime.js"></script></head><body><style>
.u002{--bg:var(--accent);--fg:var(--background);--blob:var(--accent);
  position:relative;width:340px;height:200px;display:grid;place-items:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .u002{--bg:var(--background);--fg:var(--accent)}}
:root[data-theme="dark"] .u002{--bg:var(--background);--fg:var(--accent)}
.u002-mag{transition:translate .9s var(--ux-spring)}
.u002-btn{position:relative;display:flex;align-items:center;gap:18px;height:76px;padding:0 10px 0 32px;border:0;border-radius:999px;background:var(--bg);color:var(--fg);overflow:hidden;isolation:isolate;
  box-shadow:none;
  transition:transform .6s var(--ux-spring)}
.u002-btn:active{transform:scale(.96)}
.u002-btn:focus-visible{outline:2px solid var(--ux-accent);outline-offset:5px}
/* 오른쪽 원이 커서를 올리면 버튼 전체로 번집니다 */
.u002-fill{position:absolute;inset:0;z-index:-1;background:var(--blob);clip-path:circle(28px at calc(100% - 38px) 50%);transition:clip-path .8s var(--ux-ease)}
.u002-btn:hover .u002-fill,.u002-btn:focus-visible .u002-fill{clip-path:circle(160% at calc(100% - 38px) 50%)}
.u002-txt{position:relative;overflow:hidden;padding:5px 0;font-size:var(--forge-text-lg-size);font-weight:var(--forge-font-bold-weight);letter-spacing:-.03em;white-space:nowrap;transition:translate .7s var(--ux-spring),color .5s var(--ux-ease)}
.u002-btn:hover .u002-txt{color:var(--accent-foreground)}
.u002-txt span{display:block;transition:transform .6s var(--ux-spring),opacity .35s var(--ux-ease)}
.u002-txt span+span{position:absolute;left:0;top:5px;transform:translateY(130%);opacity:0}
.u002[data-state="go"] .u002-txt span:first-child{transform:translateY(-130%);opacity:0}
.u002[data-state="go"] .u002-txt span+span{transform:none;opacity:1}
.u002-orb{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--accent-foreground);overflow:hidden;flex:none;transition:translate .7s var(--ux-spring)}
.u002-orb svg{position:absolute;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.u002-orb svg:last-child{transform:translateX(-46px)}
.u002[data-state="go"] .u002-orb svg:first-child{animation:u002-out .55s var(--ux-ease) forwards}
.u002[data-state="go"] .u002-orb svg:last-child{animation:u002-in .6s var(--ux-spring) .28s forwards}
@keyframes u002-out{to{transform:translateX(46px)}}
@keyframes u002-in{to{transform:none}}
.u002-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
<div class="ux u002" data-state="idle">
  <div class="u002-mag">
    <button class="u002-btn" type="button">
      <span class="u002-fill" aria-hidden="true"></span>
      <span class="u002-txt"><span>Start a project</span><span aria-hidden="true">You’re all set</span></span>
      <span class="u002-orb" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </span>
    </button>
  </div>
  <span class="u002-live" aria-live="polite"></span>
</div><script>(function () {
  var root = document.currentScript.previousElementSibling;
  var btn = root.querySelector('.u002-btn');
  var mag = root.querySelector('.u002-mag');
  var txt = root.querySelector('.u002-txt');
  var orb = root.querySelector('.u002-orb');
  var live = root.querySelector('.u002-live');

  var t = 0;

  // 버튼 전체, 글자, 화살표 원이 서로 다른 깊이로 커서를 따라옵니다
  root.addEventListener('pointermove', function (e) {
    if (window.forgeReduced()) return;
    var r = btn.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2);
    var dy = e.clientY - (r.top + r.height / 2);
    var p = Math.max(0, 1 - Math.hypot(dx, dy) / 240);
    mag.style.translate = (dx * 0.12 * p).toFixed(1) + 'px ' + (dy * 0.22 * p).toFixed(1) + 'px';
    txt.style.translate = (dx * 0.05 * p).toFixed(1) + 'px ' + (dy * 0.08 * p).toFixed(1) + 'px';
    orb.style.translate = (dx * 0.1 * p).toFixed(1) + 'px ' + (dy * 0.14 * p).toFixed(1) + 'px';
  });
  root.addEventListener('pointerleave', function () {
    mag.style.translate = txt.style.translate = orb.style.translate = '0px 0px';
  });

  // 누르면 화살표가 빠져나갔다 돌아오고, 문구가 굴러 바뀐 뒤 원래대로 돌아옵니다
  btn.addEventListener('click', function () {
    clearTimeout(t);
    root.dataset.state = 'idle';
    void btn.offsetWidth;
    root.dataset.state = 'go';
    live.textContent = 'You’re all set';
    t = setTimeout(function () { if (root.isConnected) { root.dataset.state = 'idle'; live.textContent = ''; } }, window.forgeReduced() ? 900 : 1900);
  });
})();</script></body></html>
